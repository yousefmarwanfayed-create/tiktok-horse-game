<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live Game | بث تفاعلي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        /* الحاوية الرئيسية */
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* رأس الصفحة */
        .header {
            background: linear-gradient(90deg, #fe2c55, #ff6b6b);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(254, 44, 85, 0.3);
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header h1::before {
            content: "🎮";
            font-size: 2rem;
        }

        .header p {
            opacity: 0.9;
            margin-top: 8px;
            font-size: 0.9rem;
        }

        /* منطقة التحكم */
        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .username-section {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .username-section label {
            font-weight: bold;
            color: #fe2c55;
        }

        .username-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 20px;
            border: 2px solid #fe2c55;
            background: #0a0a0a;
            color: white;
            border-radius: 50px;
            font-size: 16px;
            direction: ltr;
            text-align: right;
        }

        .username-input:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(254, 44, 85, 0.5);
        }

        .connect-btn {
            background: linear-gradient(90deg, #fe2c55, #ff6b6b);
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            font-size: 16px;
        }

        .connect-btn:hover {
            transform: scale(1.05);
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .status.online {
            background: rgba(0, 255, 0, 0.2);
            color: #0f0;
            border: 1px solid #0f0;
        }

        .status.offline {
            background: rgba(255, 0, 0, 0.2);
            color: #f00;
            border: 1px solid #f00;
        }

        /* شبكة المحتوى */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
        }

        /* قائمة الأحداث */
        .events-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .events-header {
            font-size: 1.3rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #fe2c55;
            display: flex;
            justify-content: space-between;
        }

        .clear-btn {
            background: #333;
            padding: 5px 15px;
            border: none;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 12px;
        }

        .events-list {
            max-height: 500px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* بطاقات الأحداث */
        .event-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border-radius: 12px;
            padding: 12px 15px;
            border-right: 4px solid;
            animation: slideIn 0.3s ease;
            transition: transform 0.2s;
        }

        .event-card:hover {
            transform: translateX(-5px);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .event-chat { border-right-color: #25f4ee; }
        .event-gift { border-right-color: #fe2c55; }
        .event-follow { border-right-color: #ffd700; }
        .event-join { border-right-color: #00ff88; }

        .event-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .event-icon {
            font-size: 20px;
        }

        .event-username {
            font-weight: bold;
            color: #fe2c55;
        }

        .event-time {
            font-size: 10px;
            opacity: 0.5;
            margin-right: auto;
        }

        .event-content {
            font-size: 14px;
            margin-right: 30px;
        }

        .gift-animation {
            display: inline-block;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* لوحة الإحصائيات */
        .stats-panel {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: fit-content;
        }

        .stats-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-align: center;
            color: #fe2c55;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #fe2c55;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.7;
        }

        .recent-gift {
            font-size: 12px;
            margin-top: 5px;
            color: #ffd700;
        }

        /* شريط التمرير */
        .events-list::-webkit-scrollbar {
            width: 5px;
        }

        .events-list::-webkit-scrollbar-track {
            background: #333;
            border-radius: 10px;
        }

        .events-list::-webkit-scrollbar-thumb {
            background: #fe2c55;
            border-radius: 10px;
        }

        /* توافق الجوال */
        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            .username-section {
                flex-direction: column;
            }
            .username-input, .connect-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>TikTok Live تفاعلي</h1>
            <p>شاهد التعليقات والهدايا والمتابعات في الوقت الفعلي</p>
        </div>

        <div class="control-panel">
            <div class="username-section">
                <label>📺 اسم المستخدم:</label>
                <input type="text" id="usernameInput" class="username-input" placeholder="مثال: tiktok" value="tiktok">
                <button id="connectBtn" class="connect-btn">🚀 ابدأ الاستقبال</button>
            </div>
            <div id="statusDiv" class="status offline">⚪ غير متصل</div>
        </div>

        <div class="content-grid">
            <div class="events-container">
                <div class="events-header">
                    <span>📡 الأحداث المباشرة</span>
                    <button id="clearBtn" class="clear-btn">مسح الكل</button>
                </div>
                <div id="eventsList" class="events-list">
                    <div style="text-align: center; opacity: 0.5; padding: 20px;">في انتظار الاتصال...</div>
                </div>
            </div>

            <div class="stats-panel">
                <div class="stats-title">📊 إحصائيات البث</div>
                <div class="stat-card">
                    <div class="stat-value" id="chatCount">0</div>
                    <div class="stat-label">💬 تعليقات</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="giftCount">0</div>
                    <div class="stat-label">🎁 هدايا</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="followCount">0</div>
                    <div class="stat-label">➕ متابعات جديدة</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="joinCount">0</div>
                    <div class="stat-label">👥 انضمام للحظة</div>
                </div>
                <div class="stat-card" id="lastGift">
                    <div class="stat-label">🎀 آخر هدية</div>
                    <div class="recent-gift">لا توجد هدايا بعد</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket = null;
        let currentUsername = '';
        
        // الإحصائيات
        let stats = {
            chats: 0,
            gifts: 0,
            follows: 0,
            joins: 0,
            lastGift: ''
        };

        function updateStats() {
            document.getElementById('chatCount').textContent = stats.chats;
            document.getElementById('giftCount').textContent = stats.gifts;
            document.getElementById('followCount').textContent = stats.follows;
            document.getElementById('joinCount').textContent = stats.joins;
            if (stats.lastGift) {
                document.querySelector('#lastGift .recent-gift').innerHTML = stats.lastGift;
            }
        }

        function addEvent(type, username, message, icon) {
            const eventsList = document.getElementById('eventsList');
            const time = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            let eventClass = 'event-card';
            let contentHtml = '';
            
            switch(type) {
                case 'chat':
                    eventClass += ' event-chat';
                    contentHtml = `<div class="event-content">💬 "${message}"</div>`;
                    break;
                case 'gift':
                    eventClass += ' event-gift';
                    contentHtml = `<div class="event-content"><span class="gift-animation">🎁 أرسل ${message}</span></div>`;
                    stats.lastGift = `${username} أرسل ${message}`;
                    updateStats();
                    break;
                case 'follow':
                    eventClass += ' event-follow';
                    contentHtml = `<div class="event-content">➕ تابع البث!</div>`;
                    break;
                case 'join':
                    eventClass += ' event-join';
                    contentHtml = `<div class="event-content">👋 انضم إلى البث</div>`;
                    break;
            }
            
            const eventDiv = document.createElement('div');
            eventDiv.className = eventClass;
            eventDiv.innerHTML = `
                <div class="event-header">
                    <span class="event-icon">${icon}</span>
                    <span class="event-username">${username}</span>
                    <span class="event-time">${time}</span>
                </div>
                ${contentHtml}
            `;
            
            eventsList.insertBefore(eventDiv, eventsList.firstChild);
            
            // تحديد عدد العناصر المعروضة
            while(eventsList.children.length > 100) {
                eventsList.removeChild(eventsList.lastChild);
            }
        }

        function updateStatus(online, message) {
            const statusDiv = document.getElementById('statusDiv');
            if(online) {
                statusDiv.className = 'status online';
                statusDiv.innerHTML = `🟢 متصل بـ @${currentUsername}`;
            } else {
                statusDiv.className = 'status offline';
                statusDiv.innerHTML = `🔴 ${message || 'غير متصل'}`;
            }
        }

        function connectToStream() {
            const username = document.getElementById('usernameInput').value.trim();
            if(!username) {
                alert('يرجى إدخال اسم مستخدم TikTok');
                return;
            }
            
            currentUsername = username;
            
            if(socket) {
                socket.disconnect();
            }
            
            socket = io();
            
            socket.on('connect', () => {
                socket.emit('joinStream', { username: currentUsername });
                updateStatus(false, 'جاري الاتصال...');
            });
            
            socket.on('tiktokEvent', (event) => {
                switch(event.type) {
                    case 'chat':
                        stats.chats++;
                        addEvent('chat', event.data.nickname, event.data.comment, '💬');
                        updateStats();
                        break;
                    case 'gift':
                        stats.gifts++;
                        addEvent('gift', event.data.nickname, event.data.giftName, '🎁');
                        updateStats();
                        break;
                    case 'follow':
                        stats.follows++;
                        addEvent('follow', event.data.nickname, '', '➕');
                        updateStats();
                        break;
                    case 'join':
                        stats.joins++;
                        addEvent('join', event.data.nickname, '', '👋');
                        updateStats();
                        break;
                }
            });
            
            socket.on('streamStatus', (data) => {
                if(data.connected) {
                    updateStatus(true, 'متصل');
                } else {
                    updateStatus(false, data.message || 'غير متصل');
                }
            });
            
            socket.on('disconnect', () => {
                updateStatus(false, 'تم قطع الاتصال');
            });
        }

        document.getElementById('connectBtn').addEventListener('click', connectToStream);
        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('eventsList').innerHTML = '<div style="text-align: center; opacity: 0.5; padding: 20px;">تم مسح الأحداث</div>';
        });
        
        // تنفيذ الاتصال التلقائي عند التحميل
        setTimeout(() => {
            connectToStream();
        }, 1000);
    </script>
</body>
</html>
