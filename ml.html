<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 TikTok Live Dashboard</title>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a12;
            color: #fff;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a12 0%, #1a0a2e 50%, #0a0a12 100%);
        }
        .header {
            background: rgba(10, 10, 18, 0.92);
            backdrop-filter: blur(20px);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid rgba(254, 44, 85, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #fe2c55, #ff6b8a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo i { font-size: 32px; }
        .live-badge {
            background: #fe2c55;
            color: #fff;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .status-text {
            color: #4ade80;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 1.5s infinite;
        }
        .status-dot.offline { background: #ef4444; }
        .stats-mini {
            display: flex;
            gap: 15px;
            background: rgba(255,255,255,0.05);
            padding: 8px 16px;
            border-radius: 30px;
            flex-wrap: wrap;
        }
        .stats-mini .item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #aaa;
        }
        .stats-mini .item .num { color: #fff; font-weight: 700; font-size: 15px; }
        .stats-mini .item .num.gold { color: #ffd700; }
        .stats-mini .item .num.pink { color: #fe2c55; }
        .stats-mini .item .num.green { color: #4ade80; }
        .stats-mini .item .num.blue { color: #60a5fa; }
        .container {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .card {
            background: rgba(26, 26, 46, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .card-title .badge {
            background: #fe2c55;
            color: #fff;
            border-radius: 30px;
            padding: 0 12px;
            font-size: 12px;
            font-weight: 700;
            height: 22px;
            display: flex;
            align-items: center;
        }
        .card-title .badge.gold { background: #ffd700; color: #000; }
        .comments-container, .gifts-container, .activity-container {
            max-height: 350px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .comments-container::-webkit-scrollbar,
        .gifts-container::-webkit-scrollbar,
        .activity-container::-webkit-scrollbar {
            width: 4px;
        }
        .comments-container::-webkit-scrollbar-thumb { background: #fe2c55; border-radius: 10px; }
        .gifts-container::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 10px; }
        .activity-container::-webkit-scrollbar-thumb { background: #60a5fa; border-radius: 10px; }
        .comment-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 14px;
            margin-bottom: 6px;
            animation: slideIn 0.4s ease;
            background: rgba(255,255,255,0.02);
        }
        .comment-item .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #fe2c55;
            object-fit: cover;
            flex-shrink: 0;
            background: #2a2a4a;
        }
        .comment-item .info { flex: 1; }
        .comment-item .name {
            font-size: 13px;
            font-weight: 600;
            color: #fe2c55;
        }
        .comment-item .text {
            font-size: 14px;
            color: #e0e0e0;
            margin-top: 2px;
            word-wrap: break-word;
        }
        .gift-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.01));
            border-radius: 14px;
            margin-bottom: 6px;
            border: 1px solid rgba(255,215,0,0.08);
            animation: slideIn 0.4s ease;
        }
        .gift-item .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            object-fit: cover;
            flex-shrink: 0;
            background: #2a2a4a;
        }
        .gift-item .info { flex: 1; }
        .gift-item .name { font-size: 13px; font-weight: 600; color: #ddd; }
        .gift-item .gift-details {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 2px;
            flex-wrap: wrap;
        }
        .gift-item .gift-name { color: #ffd700; font-weight: 700; font-size: 15px; }
        .gift-item .gift-count {
            background: rgba(255,215,0,0.15);
            color: #ffd700;
            padding: 0 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .activity-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 4px;
            animation: slideIn 0.3s ease;
            background: rgba(255,255,255,0.02);
        }
        .activity-item .icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .activity-item .icon.follow { background: rgba(74,222,128,0.15); color: #4ade80; }
        .activity-item .icon.share { background: rgba(96,165,250,0.15); color: #60a5fa; }
        .activity-item .icon.gift { background: rgba(255,215,0,0.15); color: #ffd700; }
        .activity-item .icon.comment { background: rgba(254,44,85,0.15); color: #fe2c55; }
        .activity-item .info { flex: 1; font-size: 13px; color: #ccc; }
        .activity-item .info strong { color: #fff; font-weight: 600; }
        .activity-item .time { font-size: 10px; color: #555; }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #444;
        }
        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            .header { padding: 12px 16px; }
            .container { padding: 12px; }
            .stats-mini { gap: 10px; padding: 6px 12px; }
            .stats-mini .item { font-size: 11px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <div class="logo"><i class="fab fa-tiktok"></i><span>Live</span></div>
            <div class="live-badge"><i class="fas fa-circle"></i> LIVE</div>
            <div class="status-text">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">جاري الاتصال...</span>
            </div>
        </div>
        <div class="stats-mini">
            <div class="item"><i class="fas fa-comment" style="color:#fe2c55;"></i><span class="num pink" id="miniComments">0</span></div>
            <div class="item"><i class="fas fa-gift" style="color:#ffd700;"></i><span class="num gold" id="miniGifts">0</span></div>
            <div class="item"><i class="fas fa-user-plus" style="color:#4ade80;"></i><span class="num green" id="miniFollows">0</span></div>
            <div class="item"><i class="fas fa-share" style="color:#60a5fa;"></i><span class="num blue" id="miniShares">0</span></div>
        </div>
    </header>
    <div class="container">
        <div class="left-panel">
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-comment" style="color:#fe2c55;"></i>
                    التعليقات
                    <span class="badge" id="commentBadge">0</span>
                </div>
                <div class="comments-container" id="commentsContainer">
                    <div class="empty-state"><i class="fas fa-comment-slash"></i><p>⏳ في انتظار التعليقات...</p></div>
                </div>
            </div>
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-gift" style="color:#ffd700;"></i>
                    الهدايا
                    <span class="badge gold" id="giftBadge">0</span>
                </div>
                <div class="gifts-container" id="giftsContainer">
                    <div class="empty-state"><i class="fas fa-gift"></i><p>⏳ في انتظار الهدايا...</p></div>
                </div>
            </div>
        </div>
        <div class="right-panel">
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-bolt" style="color:#60a5fa;"></i>
                    النشاطات
                </div>
                <div class="activity-container" id="activityContainer">
                    <div class="empty-state"><i class="fas fa-clock"></i><p>⏳ في انتظار الأحداث...</p></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const socket = io();
        let stats = { comments: 0, gifts: 0, follows: 0, shares: 0 };

        socket.on('connect', function() {
            document.getElementById('statusDot').className = 'status-dot';
            document.getElementById('statusText').textContent = 'متصل بالخادم';
            console.log('✅ Socket.IO Connected');
        });

        socket.on('connect_error', function(error) {
            document.getElementById('statusDot').className = 'status-dot offline';
            document.getElementById('statusText').textContent = '⚠️ خطأ في الاتصال';
            console.log('❌ Socket.IO Error:', error);
        });

        socket.on('system', function(data) {
            document.getElementById('statusDot').className = 'status-dot';
            document.getElementById('statusText').textContent = data.msg;
        });

        socket.on('comment', function(data) {
            stats.comments++;
            updateStats();
            const container = document.getElementById('commentsContainer');
            if (container.querySelector('.empty-state')) container.innerHTML = '';
            container.insertAdjacentHTML('afterbegin', `
                <div class="comment-item">
                    <img class="avatar" src="${data.avatar || 'https://ui-avatars.com/api/?name='+data.nickname+'&background=fe2c55&color=fff&size=40'}" onerror="this.src='https://ui-avatars.com/api/?name=${data.nickname}&background=fe2c55&color=fff&size=40'">
                    <div class="info">
                        <div class="name">${data.nickname}</div>
                        <div class="text">${data.text}</div>
                    </div>
                </div>
            `);
            document.getElementById('commentBadge').textContent = stats.comments;
            addActivity('comment', data.nickname, data.text);
        });

        socket.on('gift', function(data) {
            stats.gifts++;
            updateStats();
            const container = document.getElementById('giftsContainer');
            if (container.querySelector('.empty-state')) container.innerHTML = '';
            container.insertAdjacentHTML('afterbegin', `
                <div class="gift-item">
                    <img class="avatar" src="${data.avatar || 'https://ui-avatars.com/api/?name='+data.nickname+'&background=ffd700&color=fff&size=40'}" onerror="this.src='https://ui-avatars.com/api/?name=${data.nickname}&background=ffd700&color=fff&size=40'">
                    <div class="info">
                        <div class="name">${data.nickname}</div>
                        <div class="gift-details">
                            <span class="gift-name">🎁 ${data.gift}</span>
                            <span class="gift-count">×${data.count}</span>
                            <span style="color:#888;font-size:11px;">💎 ${data.diamonds}</span>
                        </div>
                    </div>
                </div>
            `);
            document.getElementById('giftBadge').textContent = stats.gifts;
            addActivity('gift', data.nickname, `🎁 ${data.gift} ×${data.count}`);
        });

        socket.on('follow', function(data) {
            stats.follows++;
            updateStats();
            addActivity('follow', data.nickname, 'متابعة جديدة');
        });

        socket.on('share', function(data) {
            stats.shares++;
            updateStats();
            addActivity('share', data.nickname, 'شارك البث');
        });

        function updateStats() {
            document.getElementById('miniComments').textContent = stats.comments;
            document.getElementById('miniGifts').textContent = stats.gifts;
            document.getElementById('miniFollows').textContent = stats.follows;
            document.getElementById('miniShares').textContent = stats.shares;
        }

        function addActivity(type, name, action) {
            const container = document.getElementById('activityContainer');
            if (container.querySelector('.empty-state')) container.innerHTML = '';
            const icons = { comment:'comment', gift:'gift', follow:'follow', share:'share' };
            container.insertAdjacentHTML('afterbegin', `
                <div class="activity-item">
                    <div class="icon ${type}"><i class="fas fa-${icons[type]}"></i></div>
                    <div class="info"><strong>${name}</strong> ${action}</div>
                    <span class="time">الآن</span>
                </div>
            `);
        }

        // Keep last 100 items
        setInterval(() => {
            ['commentsContainer','giftsContainer','activityContainer'].forEach(id => {
                const el = document.getElementById(id);
                const items = el.querySelectorAll('.comment-item, .gift-item, .activity-item');
                if (items.length > 100) {
                    items.forEach((item, i) => { if (i >= 100) item.remove(); });
                }
            });
        }, 10000);
    </script>
</body>
</html>
